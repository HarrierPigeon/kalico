# Sample configuration for a hardware emergency-stop input.
#
# Wire an industrial NC (normally-closed) mushroom-head button between an
# MCU GPIO pin and ground. With the internal pull-up enabled, the pin reads
# LOW when the button is healthy and circuit is intact, and HIGH when the
# button is pressed *or* the wire is cut/unplugged/damaged - in all those
# cases the machine trips. See DESIGN.md for full wiring details and
# safety caveats.
#
# When the button is pressed, the MCU firmware itself calls shutdown()
# without involving the host. The host sees a normal MCU shutdown with
# the static string "Emergency stop button pressed".

[hardware_estop]
# MCU pin connected to the emergency-stop button. Use the standard Kalico
# pin syntax: "PA10", "gpio6", "mcu_toolhead:PB2", etc. The pin's chip
# determines which MCU's firmware will be configured to watch the pin.
pin: PA10

# Whether to enable the MCU's internal pull-up resistor. Default True,
# which is correct for the recommended NC-to-ground wiring. Set False
# only if you have an external pull-up/pull-down resistor and know what
# you're doing.
#pullup: True

# If True, the pin reading HIGH is treated as "tripped" - this is what
# you want for the recommended NC-to-ground-with-pull-up wiring (pressed
# button releases the pull-up, pin floats HIGH, trip). Default False
# (NO button to 3.3V with pull-down, pressing connects pin to VCC).
# For safety reasons, the NC wiring (invert=True) is strongly recommended.
invert: True
