# Test config for RELOAD_CONFIG (test/test_config_reload.py). The tests copy
# one of the tuning_*.cfg files over tuning.cfg and reload.

[mcu]
serial: /dev/ttyACM0

[constants]
z_accel: 100

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5
max_z_velocity: 5
max_z_accel: ${constants.z_accel}

[stepper_x]
step_pin: PE0
dir_pin: PE1
enable_pin: !PE2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE3
position_endstop: 0
position_max: 200

[tmc2209 stepper_x]
uart_pin: PE4
run_current: 0.5
sense_resistor: 0.110

[stepper_y]
step_pin: PF0
dir_pin: PF1
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF3
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PG0
dir_pin: PG1
enable_pin: !PG2
microsteps: 16
rotation_distance: 8
endstop_pin: ^PG3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PD0
dir_pin: PD1
enable_pin: !PD2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
pressure_advance: 0.04

[heater_bed]
heater_pin: PD4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: watermark
min_temp: 0
max_temp: 130

[input_shaper]
shaper_freq_x: 50
shaper_freq_y: 40

[print_stats]

[gcode_macro TEST_MACRO]
description: First version
variable_count: 1
variable_untouched: 'keep'
gcode:
  SET_GCODE_VARIABLE MACRO=TEST_MACRO VARIABLE=count VALUE=10

[delayed_gcode TEST_DELAYED]
gcode:
  SET_GCODE_VARIABLE MACRO=TEST_MACRO VARIABLE=count VALUE=20

[include tuning.cfg]
