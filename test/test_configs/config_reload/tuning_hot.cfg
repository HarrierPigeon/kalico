# Only edits RELOAD_CONFIG can apply live
[printer]
max_accel: 5000
square_corner_velocity: 8
minimum_cruise_ratio: 0.25
max_z_velocity: 10

[tmc2209 stepper_x]
run_current: 0.8
driver_TBL: 1

[extruder]
pressure_advance: 0.06
pressure_advance_smooth_time: 0.03
rotation_distance: 22.6
pid_Kp: 30.5
smooth_time: 2.0
min_extrude_temp: 180

[heater_bed]
max_delta: 3.0

[input_shaper]
shaper_type_x: ei
shaper_freq_x: 52.5
damping_ratio_y: 0.15

[gcode_macro TEST_MACRO]
description: Second version
variable_count: 2
variable_added: 'new'
gcode:
  SET_GCODE_VARIABLE MACRO=TEST_MACRO VARIABLE=count VALUE=11

[gcode_macro NEW_MACRO]
variable_ran: 0
gcode:
  SET_GCODE_VARIABLE MACRO=NEW_MACRO VARIABLE=ran VALUE=1

[delayed_gcode TEST_DELAYED]
gcode:
  SET_GCODE_VARIABLE MACRO=TEST_MACRO VARIABLE=count VALUE=21
